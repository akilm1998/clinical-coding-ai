# =============================================================================
# Ground-truth expected ICD-10-CM codes for the 30 coding regression cases.
#
# Grounding principle: DOCUMENTATION-REQUIRED. A relationship/combination code
# is expected only when the case documents the relationship — matching the
# project's design intent, which deliberately diverges from the official
# ICD-10-CM "with" convention in some cases (noted inline).
#
# Assertion model (see test_regression.py):
#   required  : every code MUST appear in the pipeline's selected+additional set
#   forbidden : none of these may appear in selected+additional
#   any_of    : passes if ANY listed alternative satisfies its required/forbidden
#               (used for genuinely contested cases)
# Matching is on CODE PRESENCE across selected_codes + additional_codes
# (bucket/role is not asserted). Codes are compared case-insensitively.
#
# Status legend in comments:
#   [confirmed]  pipeline output matched and is correct
#   [draft-fix]  my original draft was wrong; pipeline was right (rule cited)
#   [contested]  legitimate coder-judgment split; accept either answer
# Last validated: 2026-09-28 against the run captured in tests/outputs/.
# =============================================================================

case_01_diabetes_single:
  required: [E11.9]
  forbidden: []

case_02_diabetes_ckd_explicit:
  required: [E11.22, N18.1]          # diabetes->CKD documented -> combination + stage
  forbidden: [E11.9]

case_03_diabetes_ckd_coexistence:    # [draft-fix rationale] no documented link -> separate
  required: [E11.9, N18.1]
  forbidden: [E11.22]                # must NOT collapse to the combo (the "with" convention would; project intent does not)

case_04_diabetes_hypertension_explicit:
  required: [E11.9, I10]             # no diabetes+HTN combination code exists
  forbidden: []

case_05_diabetes_hypertension_coexistence:
  required: [E11.9, I10]
  forbidden: []

case_06_hypertension_single:
  required: [I10]
  forbidden: []

case_07_ckd_stage_three:
  required: [N18.30]                 # stage 3 unspecified (not 3a/3b)
  forbidden: [N18.9, N18.3]

case_08_hypertension_ckd_relationship:
  required: [I12.9, N18.30]          # HTN->CKD documented -> hypertensive CKD + stage
  forbidden: [I10]

case_09_diabetes_obesity:            # [confirmed] obesity is NOT a diabetic complication
  required: [E11.9, E66.9]
  forbidden: [E11.69]               # pipeline correctly rejected the manufactured complication

case_10_diabetes_hyperlipidemia:
  required: [E11.9, E78.5]
  forbidden: []

case_11_diabetes_ckd_hypertension:   # [draft-fix] HTN->CKD NOT documented -> I10, not I12.9
  required: [E11.22, I10, N18.1]
  forbidden: [I12.9, E11.9]

case_12_copd_single:
  required: [J44.9]
  forbidden: []

case_13_copd_hypertension:
  required: [J44.9, I10]
  forbidden: []

case_14_asthma_single:
  required: [J45.909]
  forbidden: []

case_15_asthma_rhinitis:             # [draft-fix] J30 Excludes1 "allergic rhinitis with asthma (J45.909)"
  required: [J45.909]                # -> rhinitis captured by asthma code; J30.9 must NOT be coded
  forbidden: [J30.9]

case_16_heart_failure_single:
  required: [I50.9]
  forbidden: []

case_17_heart_failure_hypertension:  # baseline-locked; contested area, coder reviews every case
  required: [I50.9, I10]              # current validated output (documentation-required reading; matches project philosophy)
  forbidden: []
  note: >
    Hypertension + heart failure is a genuine coder split (AAFP documentation-required
    reading vs the "with"-convention reading that would use I11.0 + I50.9). Every case
    is reviewed by a coder before submission, so the pipeline's defensible output is
    accepted and locked here as the regression baseline. If the pipeline later emits
    I11.0 + I50.9, that is also clinically acceptable — review and update this lock
    rather than treating it as a hard failure.

case_18_obesity_hypertension_diabetes:
  required: [E11.9, I10, E66.9]       # 3 documented relationships, none form combo codes
  forbidden: []

case_19_hypothyroidism_single:
  required: [E03.9]
  forbidden: []

case_20_gerd_single:
  required: [K21.9]
  forbidden: []

case_21_osteoarthritis_single:
  required: [M17.9]                   # laterality unspecified
  forbidden: []

case_22_depression_single:
  required: [F32.A]                   # "depression, unspecified" (newer code)
  forbidden: []

case_23_acute_bronchitis:
  required: [J20.9]
  forbidden: []

case_24_viral_respiratory_illness:
  required: [J06.9]
  forbidden: []

case_25_dental_caries:
  required: [K02.9]
  forbidden: []

case_26_acute_with_diabetes_history:  # historical diabetes must NOT be coded at acute visit
  required: [J20.9]
  forbidden: [E11.9]

case_27_historical_diabetes_current_uri:
  required: [J06.9]
  forbidden: [E11.9]

case_28_historical_multiple_current_htn:
  required: [I10]
  forbidden: [E11.9, E66.9]           # historical diabetes + obesity must NOT be coded

case_29_diabetes_ckd_anemia:          # anemia not documented as CKD-related -> D64.9, not D63.1
  required: [E11.22, N18.1, D64.9]
  forbidden: [D63.1, E11.9]

case_30_multiple_relationships:       # [draft-fix] dm->HTN documented but no combo; HTN not linked to CKD -> I10
  required: [E11.22, I10, N18.1]
  forbidden: [I12.9, E11.9]
